spring.application.name=stockly

spring.datasource.url=jdbc:mysql://localhost:3306/stockly
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

twelvedata.api-key=${TWELVE_DATA_API_KEY}
twelvedata.base-url=https://api.twelvedata.com

groq.base-url=https://api.groq.com/openai/v1

alphavantage.base-url=https://www.alphavantage.co
alphavantage.api-key=${ALPHA_VANTAGE_API_KEY}

indianapi.base-url=https://stock.indianapi.in
indianapi.api-key=${INDIAN_API_KEY}

eodhd.base-url=https://eodhd.com/api
eodhd.api-key=${EODHD_API_KEY}
